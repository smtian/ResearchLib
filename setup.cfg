[metadata]
name = paper-tracker
version = 0.1.0
description = Journal-based ML/bioinformatics paper tracker
author = Sm Tian
license = MIT
license_files = LICENSE
url = https://example.com/your-repo
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    paper-tracker = paper_tracker.cli:main
