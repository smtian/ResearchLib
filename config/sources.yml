sources:
  - id: arxiv
    type: arxiv
    enabled: true
    base_url: "http://export.arxiv.org/api/query"
    search_by:
      - doi
      - title

  - id: biorxiv
    type: biorxiv
    enabled: true
    base_url: "https://api.biorxiv.org/pubs"
    server: "biorxiv"
    search_by:
      - doi
      - title
