    tier: "A"
    topics: ["genomics", "bioinformatics", "methods", "tools"]
    notes: "NAR 子刊，偏重基因组学和生物信息方法"
    fetcher: crossref
    fetcher_params:
      days_back: 3

  - id: database
    name: "Database: The Journal of Biological Databases and Curation"
    publisher: "Oxford University Press"
    issn:
      online: "1758-0463"
    website: "https://academic.oup.com/database"
