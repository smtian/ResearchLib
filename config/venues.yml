venues:
  - id: nar
    name: "Nucleic Acids Research"
    publisher: "Oxford University Press"
    issn:
      print: "0305-1048"
      online: "1362-4962"
    website: "https://academic.oup.com/nar"
    tier: "A"
    topics: ["bioinformatics", "databases", "web-servers", "methods", "tools"]
    notes: "重点关注 Database issue 和 Web Server issue 上的新数据库/工具文章"
    fetcher: crossref
    fetcher_params:
      days_back: 3

  - id: nar_genomics_bioinformatics
    name: "NAR Genomics and Bioinformatics"
    publisher: "Oxford University Press"
    issn:
      online: "2631-9268"
