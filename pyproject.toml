[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "researchlib"
version = "0.2.0"
description = "Stateless multi-source scientific literature search MCP server"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
researchlib = "researchlib.cli:app"
researchlib-mcp = "researchlib.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/researchlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

